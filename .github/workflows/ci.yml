# CI for Mayn's World.
#
# Active jobs:
#   foundation  - checks that the required project files exist.
#   frontend    - installs dependencies from package-lock.json, then typechecks,
#                 tests and builds the React app (Node.js is frontend tooling only).
#   go          - checks formatting, vets, tests and builds the Go backend.
#   integration - builds the real React app, starts the real Go server and checks
#                 that /api/health, API 404s, SPA fallback and static serving work
#                 together on one origin.
#   docker      - builds the production image from the Dockerfile, checks it is
#                 configured to run as non-root, runs the container, repeats the
#                 smoke checks against it and checks graceful shutdown.
#
# Still disabled (commented out below): the Postgres service and migration tests
# (Phase 2). Enable it only when the files and scripts it depends on exist.
#
# `frontend` uses `npm ci`, which requires a committed package-lock.json and
# fails if it is out of sync with package.json. That is intentional.
#
# Before treating this workflow as production-hardened, review every third-party
# action and keep each one pinned to a reviewed commit SHA.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation files present
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 (commit SHA looked up from the upstream tag; review before relying on it)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check required files exist
        shell: bash
        run: |
          missing=0
          for f in \
            CLAUDE.md README.md LICENSE \
            docs/requirements.md docs/architecture.md docs/visual-design.md \
            docs/development-roadmap.md docs/decisions.md \
            .github/pull_request_template.md \
            .github/ISSUE_TEMPLATE/bug_report.md \
            .github/ISSUE_TEMPLATE/security_finding.md \
            .github/ISSUE_TEMPLATE/feature_task.md; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required file is missing"
              missing=1
            fi
          done
          exit $missing

  frontend:
    name: Frontend - install, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2 (same pin as the foundation job)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-node v4.4.0 (commit SHA looked up from the upstream tag with
      # `git ls-remote`; review before relying on it. Newer major versions exist.)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  go:
    name: Backend - format, vet, test, build
    runs-on: ubuntu-latest
    # A throwaway PostgreSQL for the tests that need a real database
    # (TestRealDatabase in internal/db). Without TEST_DATABASE_URL those tests
    # skip themselves, so local `go test ./...` still works with no database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mayn_test
          POSTGRES_USER: mayn_test
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U mayn_test -d mayn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mayn_test:ci-only-not-a-secret@127.0.0.1:5432/mayn_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # actions/setup-go v6.5.0 (commit SHA looked up from the upstream tag with
      # `git ls-remote`; review before relying on it). go.mod states the minimum
      # language version; CI runs a currently supported Go release.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27'

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  integration:
    name: Integration - React served by Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27'

      - run: npm ci
      - run: npm run build # writes the React app to dist/client
      - run: go build -o bin/server ./cmd/server

      - name: Smoke test the production server
        shell: bash
        run: |
          set -euo pipefail
          PORT=8080 ./bin/server &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 0.5
          done

          base=http://127.0.0.1:8080
          status() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          # Bodies are captured first and matched afterwards. Piping curl into
          # `grep -q` can fail spuriously under pipefail (grep exits early).
          body() { curl -s "$1"; }

          test "$(body $base/api/health)" = '{"status":"ok"}'
          test "$(status $base/api/does-not-exist)" = 404
          test "$(body $base/api/does-not-exist)" = '{"error":"not_found"}'
          [[ "$(body $base/)" == *'id="root"'* ]]
          [[ "$(body $base/some/frontend/route)" == *'id="root"'* ]]
          test "$(status $base/assets/does-not-exist.js)" = 404
          echo "Production server smoke test passed"

  docker:
    name: Docker - build image and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build the production image
        run: docker build -t mayn-s-world:ci .

      - name: Image runs as a non-root user
        shell: bash
        run: |
          user="$(docker inspect --format '{{.Config.User}}' mayn-s-world:ci)"
          echo "image user: $user"
          test "$user" = 'nonroot:nonroot'

      - name: Smoke test the container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name app -p 8080:8080 mayn-s-world:ci
          trap 'docker logs app; docker rm -f app' EXIT

          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/api/health >/dev/null && break
            sleep 0.5
          done

          base=http://127.0.0.1:8080
          status() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          body() { curl -s "$1"; }

          test "$(body $base/api/health)" = '{"status":"ok"}'
          test "$(body $base/api/does-not-exist)" = '{"error":"not_found"}'
          [[ "$(body $base/)" == *'id="root"'* ]]
          [[ "$(body $base/some/frontend/route)" == *'id="root"'* ]]
          test "$(status $base/assets/does-not-exist.js)" = 404

          # `docker stop` sends SIGTERM and waits. Exit code 0 means the server
          # shut down gracefully; 137 would mean it ignored SIGTERM and was killed.
          docker stop -t 15 app
          test "$(docker inspect --format '{{.State.ExitCode}}' app)" = 0
          echo "Container smoke test passed"

  compose:
    name: Compose - app + PostgreSQL, health and persistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create .env from the example with a generated password
        shell: bash
        run: |
          cp .env.example .env
          # hex only, so it is safe inside the DATABASE_URL that Compose builds.
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env

      - name: Validate the Compose file
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up --build -d

      - name: Run the checks
        shell: bash
        run: |
          set -euo pipefail
          # Always show logs and clean up, pass or fail. -v also deletes the
          # volume, which only ever holds CI test data.
          trap 'docker compose logs --no-color; docker compose down -v' EXIT

          base=http://127.0.0.1:8080
          sql() { docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c "$1"' _ "$1"; }
          # Retries until the expected body appears (the app needs a moment to
          # start, and its pool needs a moment to reconnect after a DB restart).
          wait_for_health() {
            for _ in $(seq 1 40); do
              [ "$(curl -s "$base/api/health" || true)" = "$1" ] && return 0
              sleep 1
            done
            echo "::error::/api/health never returned: $1"; curl -si "$base/api/health" || true; return 1
          }

          echo "1. app and database healthy"
          wait_for_health '{"status":"ok","database":"ok"}'

          echo "2. React app is served by the same container"
          [[ "$(curl -s $base/)" == *'id="root"'* ]]

          echo "3. database is not published on the host"
          ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null

          echo "4. data survives a restart of the database service"
          sql "CREATE TABLE ci_persistence (note text); INSERT INTO ci_persistence VALUES ('still here');"
          docker compose restart db
          for _ in $(seq 1 30); do
            [ "$(sql 'SELECT note FROM ci_persistence' 2>/dev/null || true)" = "still here" ] && break
            sleep 1
          done
          test "$(sql 'SELECT note FROM ci_persistence')" = "still here"

          echo "5. data survives removing and recreating the containers (volume kept)"
          docker compose down
          docker compose up -d
          for _ in $(seq 1 30); do
            [ "$(sql 'SELECT note FROM ci_persistence' 2>/dev/null || true)" = "still here" ] && break
            sleep 1
          done
          test "$(sql 'SELECT note FROM ci_persistence')" = "still here"

          echo "6. health reports 503 without leaking details while the database is stopped"
          wait_for_health '{"status":"ok","database":"ok"}'
          docker compose stop db
          status="$(curl -s -o /tmp/body -w '%{http_code}' "$base/api/health")"
          test "$status" = 503
          test "$(cat /tmp/body)" = '{"status":"unavailable","database":"unavailable"}'

          echo "7. app recovers by itself when the database comes back"
          docker compose start db
          wait_for_health '{"status":"ok","database":"ok"}'

          echo "8. app stops cleanly: docker stop exits 0 (graceful shutdown, pool closed)"
          docker compose stop -t 15 app
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps -a -q app)")" = 0

          echo "Compose checks passed"

  # ---------------------------------------------------------------------------
